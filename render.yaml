services:
  - type: web
    name: phishguard-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://your-vercel-domain.vercel.app # TODO: Update this after Vercel deployment
      - key: CORS_ORIGINS
        value: https://your-vercel-domain.vercel.app # TODO: Update this after Vercel deployment
      - key: SECRET_KEY
        generateValue: true
